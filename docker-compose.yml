version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: aquasertao_db
    environment:
      POSTGRES_USER: aquasertao_user
      POSTGRES_PASSWORD: aquasertao_password
      POSTGRES_DB: aquasertao_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
