services:
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: gunicorn api.telegram_webhook:app --bind 0.0.0.0:8080 --workers 2 --threads 4 --timeout 120
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cron_api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: gunicorn api.telegram_cron:app --bind 0.0.0.0:8081 --workers 1 --threads 2 --timeout 120
    ports:
      - "${CRON_API_PORT:-8081}:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cron_runner:
    image: curlimages/curl:8.12.1
    env_file:
      - .env
    depends_on:
      - cron_api
    command: >
      sh -ec '
      interval="$${BOT_POLL_SECONDS:-60}";
      [ "$$interval" -gt 0 ] 2>/dev/null || interval=60;
      while true; do
        if [ -n "$${CRON_SECRET:-}" ]; then
          curl -fsS -X POST "http://cron_api:8081/" -H "Authorization: Bearer $${CRON_SECRET}" || true;
        else
          curl -fsS -X POST "http://cron_api:8081/" || true;
        fi;
        sleep "$$interval";
      done
      '
    restart: unless-stopped

  bot_polling:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: python telegram_bot.py
    restart: unless-stopped
    profiles:
      - polling
