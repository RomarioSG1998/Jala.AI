spring:
  application:
    name: aquasertao-api
  datasource:
    url: jdbc:postgresql://localhost:5432/aquasertao_db
    username: aquasertao_user
    password: aquasertao_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
